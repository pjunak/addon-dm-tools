name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: addon-dm-tools

      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: addon-dm-tools/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: addon-dm-tools/go.mod
          cache-dependency-path: |
            addon-dm-tools/go.sum
            ttrpg-codex/go.sum

      - run: npm ci
        working-directory: addon-dm-tools

      - run: npm run build
        working-directory: addon-dm-tools

      - run: npm test
        working-directory: addon-dm-tools

      - run: go test ./...
        working-directory: addon-dm-tools

      - run: go vet ./...
        working-directory: addon-dm-tools

      - name: Install Chromium for rendering contracts
        run: npx playwright install --with-deps chromium
        working-directory: addon-dm-tools

      - name: Check planner rendering contract
        run: npm run test:rendering
        working-directory: addon-dm-tools

      - name: Build release package
        run: go run ./cmd/build-package
        working-directory: addon-dm-tools

      - name: Inspect release package with the host
        run: go run ./cmd/codex-addon-inspect ../addon-dm-tools/dist/dm-tools-3.0.0.zip
        working-directory: ttrpg-codex

      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-package
          path: addon-dm-tools/dist/*.zip
          if-no-files-found: error
          retention-days: 14
