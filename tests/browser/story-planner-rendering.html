<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story planner rendering contract</title>
  <style>
    :root {
      --accent-gold: #c8a040;
      --accent-gold-dim: #8b6914;
      --bg-base: #141008;
      --bg-raised: #241c0d;
      --bg-surface: #1c1509;
      --border-subtle: rgba(255,255,255,.07);
      --color-danger: #ef9a9a;
      --color-info: #90caf9;
      --color-mystery: #ce93d8;
      --font-title: Georgia, serif;
      --font-ui: Inter, "Helvetica Neue", sans-serif;
      --radius: 6px;
      --radius-lg: 12px;
      --shadow-md: 0 4px 16px rgba(0,0,0,.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --text-lg: 1.2rem;
      --text-muted: #9a8660;
      --text-parchment: #f5edd8;
      --text-xl: 1.5rem;
      --text-xs: .75rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; background: var(--bg-base); }
    .fixture-viewport { position: relative !important; width: 1000px; height: 640px; }
  </style>
</head>
<body>
  <main id="planner" class="addon-dm-tools dmt-planner-shell">
    <div>
      <button type="button" data-dmt-command="zoom-out">Zoom out</button>
      <button type="button" data-dmt-command="zoom-reset"><output data-dmt-zoom-label>103%</output></button>
      <button type="button" data-dmt-command="zoom-in">Zoom in</button>
    </div>
    <div class="dmt-story-viewport fixture-viewport">
      <div class="dmt-story-surface" data-dmt-canvas-surface data-base-width="900" data-base-height="500" data-pan-margin="0">
        <div class="dmt-story-canvas" data-dmt-zoom="1.03" data-dmt-detail="full" tabindex="0" style="width:900px;height:500px">
          <svg class="dmt-story-edges" width="900" height="500" viewBox="0 0 900 500">
            <g class="dmt-story-edge-group" data-dmt-edge-group="edge-1">
              <path class="dmt-story-edge" data-dmt-edge="edge-1" data-source="node-a" data-target="node-b"></path>
              <path class="dmt-story-edge-hit" data-dmt-edge-hit="edge-1" data-source="node-a" data-target="node-b"></path>
              <text class="dmt-story-edge-label" data-dmt-edge-label="edge-1" data-dmt-label="Follow the silver thread" data-dmt-layout-key="" text-anchor="middle"></text>
            </g>
            <path class="dmt-story-preview" data-dmt-preview hidden></path>
          </svg>
          <div class="dmt-selection-hull" data-dmt-selection-hull hidden></div>
          <div class="dmt-selection-marquee" data-dmt-marquee hidden></div>
          <article class="dmt-story-node" data-dmt-node="node-a" data-dmt-x="40" data-dmt-y="40" style="left:40px;top:40px">
            <span class="dmt-node-kind">Quest</span>
            <h3 data-dmt-text-role="title" data-dmt-text="The silver road" data-dmt-layout-key="" data-dmt-layout-measured="false">The silver road</h3>
            <p data-dmt-text-role="summary" data-dmt-text="Cross the valley before the sleeping dragon wakes." data-dmt-layout-key="" data-dmt-layout-measured="false">Cross the valley before the sleeping dragon wakes.</p>
            <div class="dmt-node-meta"><span class="codex-badge">2 links</span></div>
          </article>
          <article class="dmt-story-node" data-dmt-node="node-b" data-dmt-x="420" data-dmt-y="40" style="left:420px;top:40px">
            <span class="dmt-node-kind">Encounter</span>
            <h3 data-dmt-text-role="title" data-dmt-text="The sleeping dragon" data-dmt-layout-key="" data-dmt-layout-measured="false">The sleeping dragon</h3>
            <p data-dmt-text-role="summary" data-dmt-text="Reach the old gate without raising an alarm." data-dmt-layout-key="" data-dmt-layout-measured="false">Reach the old gate without raising an alarm.</p>
          </article>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { mountStoryCanvas } from '../../story-planner-interactions.js';
    import { FLOW_LABEL_FONT_FAMILY } from '../../story-planner-labels.js';
    import { STORY_PLANNER_STYLES } from '../../story-planner-styles.js';
    import {
      snapToDevicePixel,
      storyCanvasCardMetrics,
      storyCanvasCssVariables,
      storyCanvasRenderingMetrics,
    } from '../../story-planner-rendering.js';
    import { storyCanvasDetailLevel } from '../../story-planner-zoom.js';

    document.head.insertAdjacentHTML('beforeend', STORY_PLANNER_STYLES);

    const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const closeTo = (actual, expected, tolerance = 0.08) => Math.abs(actual - expected) <= tolerance;
    const pixelValue = (element, property) => Number.parseFloat(getComputedStyle(element)[property]);
    const normalizedFontFamily = value => String(value).replace(/[\s"]/g, '').toLowerCase();
    const transformScale = element => {
      const value = getComputedStyle(element).transform;
      if (value === 'none') return [1, 1];
      const matrix = new DOMMatrix(value);
      return [Math.hypot(matrix.a, matrix.b), Math.hypot(matrix.c, matrix.d)];
    };

    window.runRenderingContract = async ({ deviceScaleFactor }) => {
      const checks = [];
      const check = (name, pass, actual, expected) => checks.push({ name, pass, actual, expected });
      const root = document.querySelector('#planner');
      const viewport = root.querySelector('.dmt-story-viewport');
      const dispatchWheel = (deltaY, deltaMode = 0) => viewport.dispatchEvent(new WheelEvent('wheel', {
        bubbles: true,
        cancelable: true,
        clientX: 400,
        clientY: 250,
        deltaMode,
        deltaY,
      }));
      const canvas = root.querySelector('.dmt-story-canvas');
      const svg = root.querySelector('.dmt-story-edges');
      const node = root.querySelector('[data-dmt-node="node-a"]');
      const title = node.querySelector('h3');
      const summary = node.querySelector('p');
      const meta = node.querySelector('.dmt-node-meta');
      const kind = node.querySelector('.dmt-node-kind');
      const edgeLabel = root.querySelector('[data-dmt-edge-label="edge-1"]');
      const measuredFontFamily = FLOW_LABEL_FONT_FAMILY;
      let generation = 0;
      let subscriber = null;
      let subscriptions = 0;
      let unsubscriptions = 0;
      const layoutText = text => {
        let values;
        if (text === 'Follow the silver thread') {
          values = generation === 0
            ? ['Follow the', 'silver thread']
            : ['Refreshed after fonts'];
        } else if (text === 'The silver road') {
          values = ['The silver', 'road'];
        } else if (text === 'The sleeping dragon') {
          values = ['The sleeping', 'dragon'];
        } else if (text.startsWith('Cross the valley')) {
          values = ['Cross the valley before', 'the sleeping dragon wakes.'];
        } else {
          values = ['Reach the old gate', 'without raising an alarm.'];
        }
        return {
          lineCount: values.length,
          height: values.length * 16,
          maxLineWidth: 84,
          lines: values.map(text => ({ text, width: 84 })),
        };
      };
      const cleanup = mountStoryCanvas({
        root,
        layoutText,
        onSelectionChange: () => {},
        onTextLayoutInvalidated: listener => {
          subscriptions += 1;
          subscriber = listener;
          return () => {
            unsubscriptions += 1;
            subscriber = null;
          };
        },
      });
      await nextFrame();

      check('planner subscribes once while mounted', subscriptions === 1 && typeof subscriber === 'function', subscriptions, 1);
      check(
        'mount normalizes an arbitrary session zoom to the nearest ladder value',
        canvas.dataset.dmtZoom === '1'
          && root.querySelector('[data-dmt-zoom-label]').textContent === '100%',
        {
          zoom: canvas.dataset.dmtZoom,
          label: root.querySelector('[data-dmt-zoom-label]').textContent,
        },
        { zoom: '1', label: '100%' },
      );
      check(
        'flow label measurement uses the rendered font stack',
        normalizedFontFamily(getComputedStyle(edgeLabel).fontFamily) === normalizedFontFamily(measuredFontFamily),
        getComputedStyle(edgeLabel).fontFamily,
        measuredFontFamily,
      );
      const layoutKey = edgeLabel.dataset.dmtLayoutKey;
      check(
        'planner materializes exact host lines',
        JSON.stringify([...edgeLabel.children].map(line => line.textContent)) === JSON.stringify(['Follow the', 'silver thread']),
        [...edgeLabel.children].map(line => line.textContent),
        ['Follow the', 'silver thread'],
      );
      check(
        'planner materializes Pretext card-title lines',
        JSON.stringify([...title.children].map(line => line.textContent)) === JSON.stringify(['The silver', 'road']),
        [...title.children].map(line => line.textContent),
        ['The silver', 'road'],
      );
      check(
        'planner materializes Pretext summary lines',
        JSON.stringify([...summary.children].map(line => line.textContent)) === JSON.stringify(['Cross the valley before', 'the sleeping dragon wakes.']),
        [...summary.children].map(line => line.textContent),
        ['Cross the valley before', 'the sleeping dragon wakes.'],
      );
      generation = 1;
      subscriber?.({ reason: 'fonts', revision: 1, locale: 'en' });
      await nextFrame();
      check(
        'invalidation rematerializes a stable geometry bucket',
        edgeLabel.dataset.dmtLayoutKey === layoutKey && edgeLabel.textContent === 'Refreshed after fonts',
        { key: edgeLabel.dataset.dmtLayoutKey, text: edgeLabel.textContent },
        { key: layoutKey, text: 'Refreshed after fonts' },
      );

      const detailBoundaries = [0.35, 0.449, 0.45, 0.599, 0.6, 0.999, 1, 2]
        .map(storyCanvasDetailLevel);
      check(
        'planner detail thresholds are stable',
        JSON.stringify(detailBoundaries) === JSON.stringify(['overview', 'overview', 'compact', 'compact', 'condensed', 'condensed', 'full', 'full']),
        detailBoundaries,
        ['overview', 'overview', 'compact', 'compact', 'condensed', 'condensed', 'full', 'full'],
      );
      dispatchWheel(800);
      await nextFrame();
      check(
        'large pixel wheel delta is limited to one zoom step',
        canvas.dataset.dmtZoom === '0.9',
        canvas.dataset.dmtZoom,
        '0.9',
      );
      dispatchWheel(-700);
      await nextFrame();
      check(
        'large reverse wheel delta stops at exactly 100%',
        canvas.dataset.dmtZoom === '1' && canvas.dataset.dmtDetail === 'full',
        { zoom: canvas.dataset.dmtZoom, detail: canvas.dataset.dmtDetail },
        { zoom: '1', detail: 'full' },
      );
      dispatchWheel(6, 1);
      await nextFrame();
      check(
        'mouse line-count settings still produce one fixed step',
        canvas.dataset.dmtZoom === '0.9',
        canvas.dataset.dmtZoom,
        '0.9',
      );
      dispatchWheel(-6, 1);
      await nextFrame();
      check(
        'reversed line wheel input returns exactly to 100%',
        canvas.dataset.dmtZoom === '1',
        canvas.dataset.dmtZoom,
        '1',
      );
      dispatchWheel(40);
      dispatchWheel(40);
      await nextFrame();
      check(
        'small trackpad deltas accumulate without stepping early',
        canvas.dataset.dmtZoom === '1',
        canvas.dataset.dmtZoom,
        '1',
      );
      dispatchWheel(40);
      await nextFrame();
      check(
        'accumulated trackpad deltas eventually take one step',
        canvas.dataset.dmtZoom === '0.9',
        canvas.dataset.dmtZoom,
        '0.9',
      );
      dispatchWheel(-100);
      await nextFrame();
      for (let index = 0; index < 7; index += 1) dispatchWheel(800);
      await nextFrame();
      check(
        'repeated wheel events reach the exact 35% ladder minimum',
        canvas.dataset.dmtZoom === '0.35' && canvas.dataset.dmtDetail === 'overview',
        { zoom: canvas.dataset.dmtZoom, detail: canvas.dataset.dmtDetail },
        { zoom: '0.35', detail: 'overview' },
      );
      for (let index = 0; index < 7; index += 1) dispatchWheel(-800);
      await nextFrame();
      check(
        'repeated reverse wheel events return exactly to 100%',
        canvas.dataset.dmtZoom === '1' && canvas.dataset.dmtDetail === 'full',
        { zoom: canvas.dataset.dmtZoom, detail: canvas.dataset.dmtDetail },
        { zoom: '1', detail: 'full' },
      );
      root.querySelector('[data-dmt-command="zoom-in"]').click();
      await nextFrame();
      check(
        'zoom button advances to the next fixed ladder value',
        canvas.dataset.dmtZoom === '1.1'
          && root.querySelector('[data-dmt-zoom-label]').textContent === '110%',
        {
          zoom: canvas.dataset.dmtZoom,
          label: root.querySelector('[data-dmt-zoom-label]').textContent,
        },
        { zoom: '1.1', label: '110%' },
      );
      root.querySelector('[data-dmt-command="zoom-out"]').click();
      await nextFrame();
      check(
        'opposite zoom button returns exactly to 100%',
        canvas.dataset.dmtZoom === '1'
          && root.querySelector('[data-dmt-zoom-label]').textContent === '100%',
        {
          zoom: canvas.dataset.dmtZoom,
          label: root.querySelector('[data-dmt-zoom-label]').textContent,
        },
        { zoom: '1', label: '100%' },
      );
      for (const zoom of [
        0.35,
        0.449,
        0.45,
        0.599,
        0.6,
        0.601,
        0.8,
        0.801,
        1,
        1.001,
        1.25,
        1.251,
        1.5,
        1.501,
        1.75,
        1.751,
        2,
      ]) {
        canvas.dataset.dmtZoom = String(zoom);
        canvas.dataset.dmtDetail = 'full';
        for (const [property, value] of Object.entries(
          storyCanvasCssVariables(zoom, deviceScaleFactor),
        )) canvas.style.setProperty(property, value);
        for (const card of canvas.querySelectorAll('[data-dmt-node]')) {
          card.style.left = `${snapToDevicePixel(
            Number(card.dataset.dmtX) * zoom,
            deviceScaleFactor,
          )}px`;
          card.style.top = `${snapToDevicePixel(
            Number(card.dataset.dmtY) * zoom,
            deviceScaleFactor,
          )}px`;
        }
        svg.setAttribute('width', String(900 * zoom));
        svg.setAttribute('height', String(500 * zoom));
        subscriber?.({ reason: 'zoom', zoom });
        await nextFrame();
        const fullDetailHeight = node.getBoundingClientRect().height;
        const detailLevel = storyCanvasDetailLevel(zoom);
        canvas.dataset.dmtDetail = detailLevel;
        await nextFrame();
        const rendering = storyCanvasRenderingMetrics(zoom, deviceScaleFactor);
        const cardMetrics = storyCanvasCardMetrics(zoom, deviceScaleFactor);
        const expected = {
          kindFont: rendering.typography.bodyFontSize,
          nodeWidth: cardMetrics.width,
          summaryFont: rendering.typography.bodyFontSize,
          titleFont: rendering.typography.titleFontSize,
        };
        const actual = {
          kindFont: pixelValue(kind, 'fontSize'),
          nodeWidth: node.getBoundingClientRect().width,
          summaryFont: pixelValue(summary, 'fontSize'),
          titleFont: pixelValue(title, 'fontSize'),
        };
        for (const property of Object.keys(expected)) {
          check(`planner ${property} at ${zoom}x`, closeTo(actual[property], expected[property]), actual[property], expected[property]);
        }
        check(
          `planner fonts stay at integer CSS sizes at ${zoom}x`,
          Number.isInteger(actual.kindFont)
            && Number.isInteger(actual.summaryFont)
            && Number.isInteger(actual.titleFont),
          actual,
          'integer font sizes',
        );
        const bounds = node.getBoundingClientRect();
        for (const [property, value] of [
          ['left', bounds.left],
          ['top', bounds.top],
          ['width', bounds.width],
        ]) {
          const physicalPixels = value * deviceScaleFactor;
          check(
            `planner node ${property} is device-pixel aligned at ${zoom}x`,
            closeTo(physicalPixels, Math.round(physicalPixels), 0.001),
            physicalPixels,
            Math.round(physicalPixels),
          );
        }
        const edgeGraphFont = pixelValue(edgeLabel, 'fontSize');
        check(
          `SVG label uses the band font size at ${zoom}x`,
          closeTo(edgeGraphFont * zoom, rendering.typography.edgeFontSize),
          edgeGraphFont * zoom,
          rendering.typography.edgeFontSize,
        );
        const expectedDisplay = {
          summary: detailLevel === 'condensed' || detailLevel === 'full' ? 'block' : 'none',
          metadata: detailLevel === 'full' ? 'flex' : 'none',
          'edge label': detailLevel === 'full' ? 'not-none' : 'none',
        };
        for (const [label, element] of [['summary', summary], ['metadata', meta], ['edge label', edgeLabel]]) {
          const display = getComputedStyle(element).display;
          const expected = expectedDisplay[label];
          check(
            `planner ${label} display at ${zoom}x`,
            expected === 'not-none' ? display !== 'none' : display === expected,
            display,
            expected,
          );
        }
        for (const [label, element] of [['kind', kind], ['title', title]]) {
          const display = getComputedStyle(element).display;
          const expectedValue = label === 'kind' && detailLevel === 'overview' ? 'none' : label === 'kind' ? 'inline' : 'block';
          check(`planner ${label} semantic display at ${zoom}x`, display === expectedValue, display, expectedValue);
        }
        check(
          `planner semantic detail removes unused card height at ${zoom}x`,
          detailLevel === 'full'
            ? closeTo(node.getBoundingClientRect().height, fullDetailHeight, 0.01)
            : node.getBoundingClientRect().height < fullDetailHeight,
          node.getBoundingClientRect().height,
          detailLevel === 'full' ? fullDetailHeight : `< ${fullDetailHeight}`,
        );
        for (const [label, element] of [['canvas', canvas], ['node', node]]) {
          const scales = transformScale(element);
          check(`${label} has no raster scale at ${zoom}x`, scales.every(scale => closeTo(scale, 1, 0.001)), scales, [1, 1]);
        }
      }

      cleanup();
      check('planner releases the borrowed subscription', unsubscriptions === 1 && subscriber === null, unsubscriptions, 1);
      return { name: 'DM Tools story planner rendering', checks, diagnostics: { deviceScaleFactor } };
    };
  </script>
</body>
</html>
